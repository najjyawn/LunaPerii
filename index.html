    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Fallback base styles before stylesheets load */
      body {
        margin: 0;
        padding: 0;
        background-color: #fff9f9;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #1e293b;
      }
      #initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .loader-pulse {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background-color: #ffe4e6;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        animation: pulse 1.5s ease-in-out infinite;
        margin-bottom: 16px;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; }
      }
    </style>
  </head>
  <body class="bg-rose-50/40 text-slate-800 antialiased selection:bg-rose-200 selection:text-rose-900 font-sans min-h-screen">
    <div id="root">
      <div id="initial-loader">
        <div class="loader-pulse">🌸</div>
        <div style="font-size: 18px; font-weight: 700; color: #e11d48; margin-bottom: 6px;">LunaPeri</div>
        <div style="font-size: 13px; color: #881337; font-weight: 500;">Memuat pelacak siklus bulanan...</div>
